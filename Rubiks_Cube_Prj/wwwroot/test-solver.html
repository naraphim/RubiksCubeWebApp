<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Solver Module Test</title>
    <style>
        body {
            font-family: monospace;
            padding: 2rem;
            background: #2a2a2a;
            color: #eee;
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            color: #55ff55;
        }

        p {
            line-height: 1.5;
            color: #ccc;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 1rem;
            background: #111;
            color: #55ff55;
            border: 1px solid #555;
            border-radius: 4px;
            font-family: monospace;
            resize: vertical;
        }

        button {
            padding: 0.75rem 1.5rem;
            margin-top: 1rem;
            cursor: pointer;
            background: #3366ff;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1rem;
            transition: background 0.2s;
        }

            button:hover {
                background: #5588ff;
            }

            button:disabled {
                background: #555;
                cursor: not-allowed;
            }

        .output {
            margin-top: 1.5rem;
            padding: 1rem;
            background: #111;
            border: 1px solid #555;
            border-radius: 4px;
            word-wrap: break-word;
            min-height: 50px;
        }

        .error {
            color: #ff5555;
            border-color: #ff5555;
        }

        .success {
            color: #55ff55;
        }

        .loading {
            color: #ffff55;
        }
    </style>
</head>
<body>
    <h1>Solver Adapter Sandbox</h1>
    <p>Paste an <code>f_state</code> or <code>c_state</code> log below. The adapter will parse it, sequentially load dependencies, correct engine inversion anomalies, and generate the proper machine input array.</p>

    <textarea id="state-input" placeholder="Paste state log here...

Example:
f_state :[20,10,51,23,4,3,0,15,28,29,41,35,16,22,42,53,37,26,27,39,33,30,40,50,11,47,17,6,1,45,21,31,48,18,19,24,25,43,36,12,49,46,44,34,9,14,52,2,32,13,5,38,8,7]

Or:
c_state :[2,11,17,7,12,14,23,1,25,9,10,22,21,4,20,15,3,6,24,8,18,13,5,19,16,0]"></textarea>

    <br>
    <button id="solve-btn">Generate Move Array</button>

    <div class="output" id="output-area">Output will appear here...</div>

    <script type="module">
        // Utilizing the robust, race-condition-free sequencer
        import { extractStateAndSolve } from './solver.js';

        document.getElementById('solve-btn').addEventListener('click', async () => {
            const btn = document.getElementById('solve-btn');
            const inputStr = document.getElementById('state-input').value;
            const outputArea = document.getElementById('output-area');

            btn.disabled = true;
            outputArea.innerHTML = `<strong class="loading">Loading dependencies and solving...</strong>`;
            outputArea.classList.remove('error', 'success');

            try {
                // Parse and send through async solver pipeline
                const moveArr = await extractStateAndSolve(inputStr);

                // Format the array structure cleanly removing outer quotation marks
                const outStr = JSON.stringify(moveArr).replace(/"/g, '');

                outputArea.innerHTML = `<strong class="success">Solution Found:</strong><br><br><code>${outStr}</code>`;
                outputArea.classList.add('success');
            } catch (e) {
                outputArea.innerHTML = `<strong>Error:</strong> ${e.message}`;
                outputArea.classList.add('error');
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
